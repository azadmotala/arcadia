<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Space Cats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The ./ stops Vite's build reading these as package names. The ?v=
       matches the version in package.json: change both with each release,
       so browsers load that release's files rather than older copies. -->
  <link href="./css/core.css?v=1.6.0" type="text/css" rel="stylesheet">
  <link href="./css/typeography.css?v=1.6.0" type="text/css" rel="stylesheet">
  <link href="./css/style.css?v=1.6.0" rel="stylesheet" type="text/css" />
  <!-- A cat in the browser tab, and on the home screen when the game is
       added to a phone. The game redraws the tab's cat as the one you play
       as. The manifest gives Android its icons and name. -->
  <link id="tabIcon" href="./icons/favicon-32.png" rel="icon" type="image/png">
  <link href="./icons/apple-touch-icon.png" rel="apple-touch-icon">
  <link href="./icons/manifest.webmanifest" rel="manifest">
  <meta name="apple-mobile-web-app-title" content="Space Cats">
</head>

<body>
  <div id="starfield"></div>
  <div id="gamecontainer">
    <canvas id="gameCanvas"></canvas>
    <form id="whoPlayed" hidden>
      <p id="whoMessage"></p>
      <div id="playerList"></div>
      <div id="newPlayer" hidden>
        <input id="playerName" maxlength="10" autocomplete="off" autocapitalize="words"
          spellcheck="false" aria-label="First name or nickname" placeholder="First name or nickname">
        <p id="playerHint"></p>
      </div>
      <div class="actions">
        <button type="submit" id="playerSave">Save</button>
        <button type="button" id="whoSkip">Skip</button>
      </div>
    </form>
  </div>
  <div id="info">
    <p id="keys">Arrow keys to move, space to fire, P to pause. <a id="homeLink" href="../../">Back to Arcadia</a></p>
    <div id="buttons">
      <button id="shareButton" type="button" onclick="shareResult()" hidden>Share</button>
      <button id="pauseButton" type="button" onclick="game.togglePause()" hidden>Pause</button>
      <button id="coloursButton" type="button" onclick="toggleColours()">Random colours</button>
      <button id="muteButton" type="button" onclick="toggleMute()">Mute</button>
    </div>
  </div>

  <script src="js/starfield.js?v=1.6.0"></script>
  <script src="js/spacecats.js?v=1.6.0"></script>
  <script src="js/leaderboard.js?v=1.6.0"></script>
  <script>
    //  Create the starfield.
    var container = document.getElementById('starfield');
    var starfield = new Starfield();
    starfield.initialise(container);
    starfield.start();

    //  Setup the canvas.
    var canvas = document.getElementById("gameCanvas");
    canvas.width = 800;
    canvas.height = 600;

    //  Create the game.
    var game = new Game();

    //  Initialise it with the game canvas.
    game.initialise(canvas);

    //  The Arcadia home page. On touch screens the start screen links to it.
    game.homeUrl = '../../';

    //  Phones and tablets get touch controls and a game scaled to fit. The
    //  800x600 canvas is mostly empty space around a 400x300 play area, so
    //  they only see this part of it (including the fish's path along the
    //  top), plus room for the buttons.
    var PLAY_AREA = { x: 180, y: 122, width: 440, height: 428 };
    //  Room the buttons need down the right-hand side, or across the top.
    var BUTTON_COLUMN_WIDTH = 164;
    var BUTTON_ROW_HEIGHT = 56;
    var touchMode = window.matchMedia('(pointer: coarse)').matches;
    game.touchMode = touchMode;
    if (touchMode) {
      document.documentElement.classList.add('touch');
      fitGame();
      window.addEventListener('resize', fitGame);
    } else {
      fitDesktop();
      window.addEventListener('resize', fitDesktop);
    }

    //  The family leaderboard, if this device has one (see js/leaderboard.js).
    game.leaderboard = Leaderboard;

    //  A link with ?daily=1, like one shared from today's challenge, opens on
    //  today's challenge.
    if (/[?&]daily=1(?:&|$)/.test(window.location.search)) {
      game.boardView = 'today';
    }
    var whoForm = document.getElementById('whoPlayed');
    var playerList = document.getElementById('playerList');
    var newPlayer = document.getElementById('newPlayer');
    var playerName = document.getElementById('playerName');
    var playerHint = document.getElementById('playerHint');
    var onPlayerPicked = null;
    var lastGameOver = null;
    var NAME_HINT = "Anyone with the board's link can see it.";

    //  Keep the buttons and the leaderboard in step with the game.
    game.onStateChange = function () {
      updateButtons();
      leaderboardStateChanged();
    };

    //  The first time a device opens a board, offer its best score this week.
    Leaderboard.onUpdate = function () {
      if (game.currentState() instanceof WelcomeState && !askingWhoPlayed() && Leaderboard.shouldOffer()) {
        var best = Leaderboard.weekBest();
        Leaderboard.markOffered();
        askWhoPlayed('Your best this week, ' + withCommas(best) + ', can go on the board. Who played?', function (player) {
          Leaderboard.highlightKey = Leaderboard.submit(player, best);
        });
      }
    };

    //  Start the game.
    game.start();

    //  Listen for keyboard events, unless the player is saying who played.
    window.addEventListener("keydown", function keydown(e) {
      if (askingWhoPlayed()) return;
      var keycode = e.which || window.event.keycode;
      //  Supress further processing of left/right/space (37/29/32)
      if (keycode == 37 || keycode == 39 || keycode == 32) {
        e.preventDefault();
      }
      //  A held key repeats. Outside of play, ignore the repeats, so holding
      //  Space as a game ends doesn't skip past the cat picker.
      if (e.repeat && !(game.currentState() instanceof PlayState)) return;
      game.keyDown(keycode);

    });

    //  Clicking a cat on the start screen picks it. On a computer, the
    //  pointer turns into a hand over anything on the canvas that can be
    //  clicked.
    canvas.addEventListener('click', function (e) {
      game.click(e);
    });
    canvas.addEventListener('mousemove', function (e) {
      game.mousemove(e);
    });
    canvas.addEventListener('mouseleave', function () {
      game.pointer = null;
    });
    window.addEventListener("keyup", function keydown(e) {
      if (askingWhoPlayed()) return;
      var keycode = e.which || window.event.keycode;
      game.keyUp(keycode);
    });

    //  Touches go to the game, except taps on the buttons and the "Who
    //  played?" box. Stopping the default keeps the browser from scrolling or
    //  zooming mid-wave. While the box is open, the game ignores touches.
    function onButton(e) {
      return e.target.closest && e.target.closest('button, a, input, #whoPlayed');
    }
    window.addEventListener('touchstart', function (e) {
      if (onButton(e)) return;
      e.preventDefault();
      if (askingWhoPlayed()) return;
      game.touchstart(e);
    }, { passive: false });
    window.addEventListener('touchmove', function (e) {
      if (onButton(e)) return;
      e.preventDefault();
      if (askingWhoPlayed()) return;
      game.touchmove(e);
    }, { passive: false });
    ['touchend', 'touchcancel'].forEach(function (type) {
      window.addEventListener(type, function (e) {
        if (!onButton(e)) e.preventDefault();
        game.touchend(e);
      }, { passive: false });
    });

    //  Browsers keep sound off until the player interacts with the page.
    ['keydown', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      window.addEventListener(type, function () {
        game.sounds.unlock();
      });
    });

    //  Pause when the player switches to another tab or app, so the game,
    //  and its sound, stop until they come back.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && game.currentState() instanceof PlayState) {
        game.togglePause();
      }
    });

    function toggleMute() {
      game.mute();
      updateButtons();
    }

    function toggleColours() {
      game.toggleRandomColours();
      updateButtons();
    }

    function updateButtons() {
      var state = game.currentState();
      var paused = state instanceof PauseState;
      var pauseButton = document.getElementById('pauseButton');
      pauseButton.textContent = paused ? 'Resume' : 'Pause';
      pauseButton.hidden = !(paused || state instanceof PlayState);
      //  Share once a game is over, after saying who played, so it can say
      //  where they are on the board.
      var shareButton = document.getElementById('shareButton');
      shareButton.hidden = !(state instanceof GameOverState) || askingWhoPlayed();
      if (shareButton.hidden) {
        shareButton.textContent = 'Share';
      }
      document.getElementById('muteButton').textContent = game.sounds.mute ? 'Unmute' : 'Mute';
      document.getElementById('coloursButton').textContent = game.randomColours ? 'All green' : 'Random colours';
    }

    //  Shares how the last game went, for the family chat: where it came on
    //  this week's board, and a link to play. Phones open their share sheet;
    //  elsewhere it's copied, ready to paste.
    function shareResult() {
      var message = resultText() + '\n' + playLink();
      if (navigator.share) {
        navigator.share({ text: message }).catch(function () {
          //  Closed without sharing.
        });
        return;
      }
      var shareButton = document.getElementById('shareButton');
      var copying = navigator.clipboard ? navigator.clipboard.writeText(message) : Promise.reject();
      copying.then(function () {
        shareButton.textContent = 'Copied';
      }, function () {
        shareButton.textContent = "Can't copy";
      });
    }

    //  "Friday night crew · Space Cats · 2nd this week with 3,870 (340 behind
    //  Dad)", for the player who just played, with their best this week. In
    //  today's challenge, "... · Kaida's fish frenzy · 1st today with 2,450
    //  (300 ahead of Mum)". Just the score if they aren't on the board.
    function resultText() {
      var daily = game.daily;
      var parts = Leaderboard.name() ? [Leaderboard.name(), 'Space Cats'] : ['Space Cats'];
      if (daily) {
        parts.push(challengeName(daily));
      }
      var standing = Leaderboard.highlightKey ? Leaderboard.standing(Leaderboard.highlightKey, daily ? 'today' : 'week') : null;
      if (!standing) {
        parts.push(withCommas(game.score) + ' points, ' + (daily ? (daily.complete ? 'all three waves' : 'wave ' + game.level) : 'level ' + game.level));
        return parts.join(' · ');
      }
      var line = ordinal(standing.rank) + (daily ? ' today with ' : ' this week with ') + withCommas(standing.score);
      if (standing.behind) {
        line += standing.behind.by ? ' (' + withCommas(standing.behind.by) + ' behind ' + standing.behind.name + ')' : ' (tied with ' + standing.behind.name + ')';
      } else if (standing.ahead) {
        line += standing.ahead.by ? ' (' + withCommas(standing.ahead.by) + ' ahead of ' + standing.ahead.name + ')' : ' (tied with ' + standing.ahead.name + ')';
      }
      parts.push(line);
      return parts.join(' · ');
    }

    //  The game's address, with the board on it if this device has one, so a
    //  tap in the chat goes straight to the same board, and after today's
    //  challenge, straight to it.
    function playLink() {
      var options = [];
      if (Leaderboard.board()) {
        options.push('board=' + Leaderboard.board());
      }
      if (game.daily) {
        options.push('daily=1');
      }
      return window.location.origin + window.location.pathname + (options.length ? '?' + options.join('&') : '');
    }

    //  1st, 2nd, 3rd, 4th ... 11th, 12th, 13th ... 21st.
    function ordinal(n) {
      var teens = n % 100 >= 11 && n % 100 <= 13;
      var suffix = teens ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' })[n % 10] || 'th';
      return n + suffix;
    }

    //  When a game ends with a score good enough for this week's top 10 (or
    //  after today's challenge, today's), ask who played, and show that
    //  board. The start and game-over screens fetch the latest board.
    function leaderboardStateChanged() {
      var state = game.currentState();
      if (state instanceof LevelIntroState) {
        Leaderboard.highlightKey = null;
      }
      if (state instanceof GameOverState && state !== lastGameOver) {
        lastGameOver = state;
        var score = game.score;
        var daily = game.daily;
        game.boardView = daily ? 'today' : 'week';
        if (Leaderboard.qualifies(score, game.boardView)) {
          askWhoPlayed(withCommas(score) + (daily ? " makes today's top 10! Who played?" : " makes this week's top 10! Who played?"), function (player) {
            Leaderboard.highlightKey = Leaderboard.submit(player, score, daily ? { day: daily.day, startedAt: daily.startedAt } : null);
          });
        }
      }
      if (state instanceof WelcomeState || state instanceof GameOverState) {
        Leaderboard.refresh();
      }
    }

    function askingWhoPlayed() {
      return !whoForm.hidden;
    }

    //  Asks who played: the board's players as buttons, this device's last
    //  player first, where one tap saves the score, and New player for
    //  someone who isn't there yet. With no players yet, it goes straight to
    //  typing a name.
    function askWhoPlayed(message, onPick) {
      document.getElementById('whoMessage').textContent = message;
      onPlayerPicked = onPick;
      playerList.textContent = '';
      var players = Leaderboard.players();
      players.forEach(function (player) {
        addPlayerButton(player.name, player.id === Leaderboard.lastPlayer() ? 'player last' : 'player', function () {
          pick(player);
        });
      });
      addPlayerButton('New player', 'player new', showNewPlayer);
      playerName.value = '';
      playerHint.textContent = NAME_HINT;
      whoForm.hidden = false;
      updateButtons();
      if (players.length) {
        playerList.hidden = false;
        newPlayer.hidden = true;
        document.getElementById('playerSave').hidden = true;
        //  On a computer, Enter picks the first name.
        playerList.firstChild.focus();
      } else {
        showNewPlayer();
      }
    }

    function addPlayerButton(label, className, onClick) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = className;
      button.textContent = label;
      button.addEventListener('click', onClick);
      playerList.appendChild(button);
    }

    //  Somebody new: a box for their first name or nickname. On a computer
    //  this puts the cursor in it; phones open their keyboard when it's
    //  tapped.
    function showNewPlayer() {
      playerList.lastChild.hidden = true;
      playerList.hidden = playerList.childNodes.length === 1;
      newPlayer.hidden = false;
      document.getElementById('playerSave').hidden = false;
      playerName.focus();
    }

    function pick(player) {
      var onPick = onPlayerPicked;
      closeWhoPlayed();
      onPick(player);
    }

    function closeWhoPlayed() {
      whoForm.hidden = true;
      onPlayerPicked = null;
      playerName.blur();
      updateButtons();
    }

    //  Letters, numbers, spaces, hyphens and apostrophes, as it's typed.
    playerName.addEventListener('input', function () {
      var tidied = Leaderboard.cleanTyping(playerName.value);
      if (tidied !== playerName.value) {
        playerName.value = tidied;
      }
      playerHint.textContent = NAME_HINT;
    });

    whoForm.addEventListener('submit', function (e) {
      e.preventDefault();
      if (newPlayer.hidden) {
        return;
      }
      var name = Leaderboard.cleanName(playerName.value);
      if (!name) {
        playerHint.textContent = 'Please type a first name or nickname';
        playerName.focus();
        return;
      }
      pick(Leaderboard.addPlayer(name));
    });

    document.getElementById('whoSkip').addEventListener('click', closeWhoPlayed);
    whoForm.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeWhoPlayed();
      }
    });

    //  Clicking a button mustn't give it keyboard focus, or the next press of
    //  Space would press the button again instead of firing.
    document.getElementById('buttons').addEventListener('mousedown', function (e) {
      e.preventDefault();
    });

    //  On touch screens, show just the play area, scaled to fill the screen.
    function fitGame() {
      var w = window.innerWidth;
      var h = window.innerHeight;

      //  Put the buttons down the right-hand side (landscape) or across the
      //  top (portrait), whichever leaves the game bigger. Across the top,
      //  the game sits a little above centre to leave room for a thumb.
      var besideScale = Math.min((w - 2 * BUTTON_COLUMN_WIDTH) / PLAY_AREA.width, h / PLAY_AREA.height);
      var belowScale = Math.min(w / PLAY_AREA.width, (h - BUTTON_ROW_HEIGHT) / PLAY_AREA.height);
      var column = besideScale > belowScale;
      var scale = column ? besideScale : belowScale;
      var top = column
        ? (h - PLAY_AREA.height * scale) / 2
        : BUTTON_ROW_HEIGHT + (h - BUTTON_ROW_HEIGHT - PLAY_AREA.height * scale) / 3;
      var left = (w - PLAY_AREA.width * scale) / 2;
      document.getElementById('buttons').classList.toggle('column', column);

      var gameContainer = document.getElementById('gamecontainer');
      gameContainer.style.left = left + 'px';
      gameContainer.style.top = top + 'px';
      gameContainer.style.width = PLAY_AREA.width * scale + 'px';
      gameContainer.style.height = PLAY_AREA.height * scale + 'px';
      canvas.style.left = -PLAY_AREA.x * scale + 'px';
      canvas.style.top = -PLAY_AREA.y * scale + 'px';
      canvas.style.width = game.width * scale + 'px';
      canvas.style.height = game.height * scale + 'px';
      setCanvasResolution(scale);
    }

    //  On computers, keep the canvas 800x600 on the page.
    function fitDesktop() {
      canvas.style.width = game.width + 'px';
      canvas.style.height = game.height + 'px';
      setCanvasResolution(1);
    }

    //  Draw at the screen's real resolution, not the page's, so the sprites
    //  and text stay sharp on high-resolution screens and when zoomed in.
    function setCanvasResolution(scale) {
      var ratio = Math.min(scale * (window.devicePixelRatio || 1), 3);
      var width = Math.round(game.width * ratio);
      var height = Math.round(game.height * ratio);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').setTransform(width / game.width, 0, 0, height / game.height, 0, 0);
      }
    }
  </script>
</body>

</html>
